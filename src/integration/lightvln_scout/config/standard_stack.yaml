# Robot settings: edit once before deployment.
vln_client:
  ros__parameters:
    server_url: ""  # e.g. ws://192.168.1.10:8050

robot_launch:
  ros__parameters:
    scout_port: "can0"
    # Measured imu -> base_link transform: metres and radians.
    imu_to_base_x: 0.0
    imu_to_base_y: 0.0
    imu_to_base_z: 0.0
    imu_to_base_roll: 0.0
    imu_to_base_pitch: 0.0
    imu_to_base_yaw: 0.0

scout_adapter:
  ros__parameters:
    hardware_output_enabled: false
