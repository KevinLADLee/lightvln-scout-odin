vln_mpc:
  ros__parameters:
    enabled: false
    response_topic: "vln/response"
    status_topic: "vln/status"
    mode_topic: "vln/mode"
    enable_topic: "mpc/enable"
    mpc_status_topic: "mpc/status"
    odom_path_topic: "vln/path_odom"
    odom_topic: "/odin1/odometry_highfreq"
    command_topic: "mpc/cmd_vel"
    odom_frame: "odom"
    odom_child_frame: "imu"
    base_frame: "base_link"

    # Conservative Scout baseline. The web page may lower these at runtime;
    # scout_adapter independently enforces the same launch safety ceiling.
    track_v_max: 0.30
    objnav_v_max: 0.20
    w_max: 0.60
    a_max_v: 0.50
    a_max_w: 1.00
    q_x: 10.0
    q_y: 10.0
    q_yaw: 1.0
    r_v: 0.1
    r_w: 0.1
    v_output_scale: 1.0
    w_output_scale: 1.0
    odom_match_max_gap_s: 0.10
    odom_timeout_s: 0.30
    metrics_log_period_s: 2.0
